<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#333;
    }

    header{
      background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
      background-size:cover;
      background-position:center;
      height:90vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
    }

    header .content{
      background:rgba(0,0,0,0.5);
      padding:30px;
      border-radius:10px;
    }

    header h1{
      font-size:55px;
      margin-bottom:15px;
    }

    header p{
      font-size:20px;
      margin-bottom:20px;
    }

    .btn{
      display:inline-block;
      padding:12px 25px;
      background:#ff6600;
      color:white;
      text-decoration:none;
      border-radius:5px;
    }

    .destinations{
      padding:50px 10%;
    }

    .destinations h2{
      text-align:center;
      margin-bottom:40px;
      font-size:35px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:200px;
      object-fit:cover;
    }

    .card h3{
      padding:15px;
    }

    .card p{
      padding:0 15px 20px;
      font-size:14px;
    }

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <div class="content">
      <h1>Explore The World</h1>
     
      <p>Discover amazing places with us</p>
      <a href="#" class="btn">Start Journey</a>
    </div>
  </header>

  <section class="destinations">
    <h2>Popular Destinations</h2>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountains">
        <h3>Switzerland</h3>
        <p>Beautiful mountains and peaceful landscapes.</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1493558103817-58b2924bce98" alt="Beach">
        <h3>Maldives</h3>
        <p>Crystal clear water and luxury beaches.</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c" alt="City">
        <h3>Paris</h3>
        <p>Enjoy romance, fashion, and famous landmarks.</p>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 Travel Explorer | Prototype Website</p>
  </footer>

</body>
</html>
